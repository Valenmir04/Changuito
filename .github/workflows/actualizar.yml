# Actualiza los precios de Changuito todos los días con los datos de SEPA.
name: Actualizar precios

on:
  schedule:
    - cron: "17 13 * * *"   # todos los días a las 10:17 (hora de Argentina)
  workflow_dispatch: {}      # permite correrlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Bajar SEPA y generar data.json
        run: python scripts/actualizar.py

      - name: Guardar los precios nuevos
        run: |
          git config user.name "changuito-bot"
          git config user.email "changuito-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios."
          else
            git commit -m "Precios actualizados $(date +%Y-%m-%d)"
            git push
          fi
